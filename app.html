<!--
  GEOPÓLEM — Configuración del adaptador de datos (Sprint 1).
  La watchlist/mapa siguen usando datos locales (data.js) por defecto.
  Para activar la carga API-first del contrato /api/v1/conflicts, poner
  GEOP_USE_API = true cuando la API v1 esté estable (ver Sprint 2).
  Si la API falla, el adaptador cae automáticamente al respaldo local.
-->
<script>
  window.GEOP_USE_API = window.GEOP_USE_API ?? false;              // API-first on/off
  window.GEOP_CONFLICTS_PATH = window.GEOP_CONFLICTS_PATH || "/api/v1/conflicts";
  // Respaldo estático opcional para GitHub Pages sin backend:
  // window.GEOP_CONFLICTS_STATIC = "./api/v1/conflicts.json";
</script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter','ui-sans-serif','system-ui'],
          display: ['Space Grotesk','Inter','ui-sans-serif'],

        },
        colors: {
          carbon: { 950:'#05080c', 900:'#080d13', 800:'#0d141d', 700:'#131c28', 600:'#1c2735', 500:'#283447' },
          radar:  { DEFAULT:'#22d3ee', deep:'#0891b2', glow:'#67e8f9' },
          alert:  { DEFAULT:'#ef4444', soft:'#fca5a5' },
          risk:   { DEFAULT:'#f59e0b', soft:'#fcd34d' },
          intel:  { DEFAULT:'#10b981', soft:'#6ee7b7' }
        },
        boxShadow: {
          'panel':'0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 40px -16px rgba(0,0,0,0.6)',
          'glow':'0 0 0 1px rgba(34,211,238,0.35), 0 0 40px -10px rgba(34,211,238,0.6)'
        },
        keyframes: {
          'radar-sweep': { '0%':{transform:'rotate(0deg)'},'100%':{transform:'rotate(360deg)'} },
          'pulse-dot':   { '0%,100%':{opacity:.95,transform:'scale(1)'}, '50%':{opacity:.4,transform:'scale(.85)'} },
          'ping-ring':   { '0%':{transform:'scale(.6)',opacity:.9},'100%':{transform:'scale(2.4)',opacity:0} },
          'scan':        { '0%':{transform:'translateY(-100%)'},'100%':{transform:'translateY(100%)'} },
          'flicker':     { '0%,100%':{opacity:1},'50%':{opacity:.86} }
        },
        animation: {
          'radar-sweep':'radar-sweep 6s linear infinite',
          'pulse-dot':'pulse-dot 2s ease-in-out infinite',
          'ping-ring':'ping-ring 2.6s cubic-bezier(0.4,0,0.6,1) infinite',

</script>

<style>
  :root { color-scheme: dark; }
  html, body, #root { height: 100%; background:#05080c; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: #e2e8f0;
    background:
      radial-gradient(1200px 700px at 78% -10%, rgba(34,211,238,0.07), transparent 60%),
      radial-gradient(900px 600px at 10% 110%, rgba(239,68,68,0.05), transparent 55%),
      #05080c;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Tactical grid background overlay */
  .tactical-grid {
    background-image:
      linear-gradient(rgba(34,211,238,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
  }
  .scanlines {
    background-image: repeating-linear-gradient(
      0deg, rgba(34,211,238,0.025) 0 1px, transparent 1px 3px
    );
    pointer-events:none;
  }

  /* Map */
  .map-svg path.land {
    fill: #0d1722;
    stroke: rgba(34,211,238,0.35);
    stroke-width: 0.4;
    transition: fill .2s;
  }
  .map-svg path.land:hover { fill:#142334; }
  .map-svg .graticule { stroke: rgba(148,163,184,0.08); stroke-width: 0.3; fill: none; }
  .map-svg .ocean { fill: #060c14; }

  /* Hotspot pulse */
  .hotspot .ring {
    transform-origin: center;
    animation: ping-ring 2.6s cubic-bezier(0.4,0,0.6,1) infinite;
  }
  .hotspot .core { animation: pulse-dot 2s ease-in-out infinite; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1c2735; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #283447; }

  .panel {
    background: linear-gradient(180deg, rgba(13,20,29,0.92), rgba(8,13,19,0.92));
    border: 1px solid rgba(34,211,238,0.12);
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 12px 40px -16px rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
  }
  .panel-soft {
    background: rgba(13,20,29,0.6);
    border: 1px solid rgba(148,163,184,0.08);
  }
  .chip {
    display:inline-flex; align-items:center; gap:.3rem;
    padding: 2px 8px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: .04em;
    text-transform: uppercase;
    border: 1px solid rgba(148,163,184,0.18);
    color:#cbd5e1;
    background: rgba(148,163,184,0.06);
  }
  .corner-tl, .corner-tr, .corner-bl, .corner-br {
    position:absolute; width:10px; height:10px; border:1px solid rgba(34,211,238,0.55);
  }
  .corner-tl { top:-1px; left:-1px; border-right:0; border-bottom:0; }
  .corner-tr { top:-1px; right:-1px; border-left:0; border-bottom:0; }
  .corner-bl { bottom:-1px; left:-1px; border-right:0; border-top:0; }
  .corner-br { bottom:-1px; right:-1px; border-left:0; border-top:0; }

  .heading-mono {
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-size: 10.5px;
    color: #94a3b8;
  }

  .glow-text { text-shadow: 0 0 16px rgba(34,211,238,0.35); }

  .boot-grid {
    background-image:
      linear-gradient(rgba(34,211,238,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,0.08) 1px, transparent 1px),
      radial-gradient(circle at 50% 42%, rgba(34,211,238,0.13), transparent 34%),
      radial-gradient(circle at 50% 50%, rgba(239,68,68,0.08), transparent 55%);
    background-size: 42px 42px, 42px 42px, 100% 100%, 100% 100%;
  }
  .boot-radar {
    position: relative;
    background:
      radial-gradient(circle, transparent 0 21%, rgba(34,211,238,0.22) 21.2% 21.8%, transparent 22% 42%, rgba(34,211,238,0.16) 42.2% 42.8%, transparent 43% 64%, rgba(34,211,238,0.12) 64.2% 64.8%, transparent 65%),
      conic-gradient(from 0deg, rgba(34,211,238,0.0), rgba(34,211,238,0.42), rgba(34,211,238,0.0) 32%);
    border: 1px solid rgba(34,211,238,0.28);
    box-shadow: 0 0 80px -25px rgba(34,211,238,0.8), inset 0 0 50px rgba(34,211,238,0.06);
  }
  .boot-radar::before,
  .boot-radar::after {
    content: "";
    position: absolute;
    inset: 50% auto auto 50%;
    width: 100%;
    height: 1px;
    background: rgba(34,211,238,0.25);
    transform: translate(-50%, -50%);
  }
  .boot-radar::after {
    width: 1px;
    height: 100%;
  }
  .boot-sweep {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: conic-gradient(from -45deg, rgba(34,211,238,0.0), rgba(34,211,238,0.55), rgba(34,211,238,0.0) 16%);
    mix-blend-mode: screen;
    animation: radar-sweep 4.8s linear infinite;
  }
  .boot-noise {
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
  }
  .boot-line {
    animation: boot-line 560ms ease-out both;
  }
  @keyframes boot-line {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Situation room dim mode */
  body.sitroom {
    background:
      radial-gradient(900px 600px at 50% 30%, rgba(34,211,238,0.10), transparent 60%),
      #02050a;
  }
  body.sitroom .panel { background: linear-gradient(180deg, rgba(6,11,17,0.96), rgba(2,5,10,0.96)); }

  /* Mobile bottom-nav safe area */
  .bottom-nav { padding-bottom: env(safe-area-inset-bottom); }

  /* Horizontal-scrollable nav without a visible scrollbar (keeps the header tidy
     while preventing the desktop nav from forcing horizontal page overflow). */
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* On the boot/initialization screen the floating buttons would overlap the
     "Inicialización del sistema" panel, so they are hidden there and replaced by
     inline CTAs inside the boot layout. */
  body.boot-screen #site-fabs { display: none; }

  /* Loading shimmer */
  .shimmer {
    background: linear-gradient(90deg, rgba(148,163,184,0.05), rgba(148,163,184,0.15), rgba(148,163,184,0.05));
    background-size: 200% 100%;
    animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>

  <script>
    (function () {
      var toggle = document.getElementById('fabs-toggle');
      var list = document.getElementById('fabs-list');
      if (!toggle || !list) return;
      toggle.addEventListener('click', function () {
        var willOpen = list.classList.contains('hidden');
        list.classList.toggle('hidden');
        toggle.setAttribute('aria-expanded', String(willOpen));
      });
    })();
  </script>

  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(() => {
          /* La app sigue funcionando aunque el entorno no permita service workers. */
        });
      });
    }
  </script>
