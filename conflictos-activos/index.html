    <!-- Rendered outside #root so it survives every rebuild of the hashed dashboard bundle. -->
    <style>
      .gp-video-cta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sp-3, 12px) var(--sp-5, 24px);
        padding: var(--sp-3, 12px) var(--sp-4, 16px);
        background: var(--s1, #0d1117);
        border-bottom: 1px solid var(--border, #263241);
        font-family: var(--font-body, system-ui, sans-serif);
        color: var(--text, #e6edf3);
      }
      .gp-video-cta__eyebrow {
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--cyan, #3dd6d0);
      }
      .gp-video-cta__title {
        font-size: 14px;
        font-weight: 500;
      }
      .gp-video-cta__note {
        font-size: 12px;
        color: var(--text-3, #8b98a8);
      }
      .gp-video-cta__links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sp-3, 12px);
        margin-left: auto;
      }
      .gp-video-cta__link {
        border: 1px solid var(--border, #263241);
        border-radius: var(--r, 8px);
        padding: 6px 12px;
        font-size: 13px;
        color: var(--text, #e6edf3);
        text-decoration: none;
      }
      .gp-video-cta__link:hover,
      .gp-video-cta__link:focus-visible {
        border-color: var(--cyan, #3dd6d0);
        color: var(--cyan, #3dd6d0);
      }
      .gp-video-cta__url {
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 11px;
        color: var(--text-3, #8b98a8);
      }

      /* Above 860px the bundle keeps html, body and #root at height:100% and clips
         .shell with overflow:hidden, so a sibling band before #root would push the
         viewport-tall app down and cut the timeline off. Letting #root take the
         remaining space instead of a flat 100% keeps the tablero within one screen.
         Below 860px the bundle already relaxes those rules and the page scrolls. */
      @media (min-width: 861px) {
        body {
          display: flex;
          flex-direction: column;
        }
        .gp-video-cta {
          flex: 0 0 auto;
        }
        #root {
          flex: 1 1 auto;
          min-height: 0;
          height: auto;
        }
      }
    </style>
  </head>
